    <style id="text-animation">
      /* ==========================================================
         Animated lettering (added). Artwork, layout and colours are
         untouched; only the grouped text elements move / fade.
         ----------------------------------------------------------
         --lift   how far a phrase floats up (subtle, in SVG units)
         --bob    seconds per float cycle
         --cycle  seconds per fade-in / hold / fade-out loop
         ========================================================== */
      .txt {
        --lift: -5px;
        --bob: 6s;
        --cycle: 16s;
        animation:
          txt-fade var(--cycle) ease-in-out infinite backwards,
          txt-bob  var(--bob)   ease-in-out infinite;
      }

      /* fade in -> hold -> fade out -> rest (opacity 0 at both ends = seamless loop) */
      @keyframes txt-fade {
        0%   { opacity: 0; }
        14%  { opacity: 1; }
        80%  { opacity: 1; }
        94%  { opacity: 0; }
        100% { opacity: 0; }
      }

      /* soft float: eases to a stop at both extremes */
      @keyframes txt-bob {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(var(--lift)); }
      }

      /* Stagger: 1st delay = when the phrase fades in, 2nd = float phase offset */
      .t-graphic   { --lift: -6px; --bob: 6.4s; animation-delay: 0s,    -1.1s; }
      .t-optim     { --lift: -4px; --bob: 5.6s; animation-delay: 0.6s,  -2.4s; }
      .t-web-tri   { --lift: -4px; --bob: 5.6s; animation-delay: 0.9s,  -2.4s; }
      .t-seo       { --lift: -4px; --bob: 5.6s; animation-delay: 1.2s,  -2.4s; }
      .t-webdesign { --lift: -5px; --bob: 6.8s; animation-delay: 1.5s,  -3.6s; }
      .t-develop   { --lift: -5px; --bob: 5.8s; animation-delay: 1.9s,  -0.8s; }
      .t-digital   { --lift: -5px; --bob: 6.2s; animation-delay: 2.3s,  -4.2s; }
      .t-print     { --lift: -4px; --bob: 5.4s; animation-delay: 2.7s,  -1.9s; }
      .t-logo      { --lift: -4px; --bob: 6.6s; animation-delay: 3.1s,  -2.9s; }
      .t-synth     { --lift: -5px; --bob: 7s;   animation-delay: 3.5s,  -5.1s; }
      .t-anim      { --lift: -4px; --bob: 5.9s; animation-delay: 3.9s,  -0.5s; }
      .t-yasi      { --lift: -6px; --bob: 6.1s; animation-delay: 4.3s,  -3.3s; }
      .t-brand     { --lift: -5px; --bob: 6.5s; animation-delay: 4.7s,  -4.6s; }
      .t-image     { --lift: -4px; --bob: 5.7s; animation-delay: 5.1s,  -1.5s; }
      /* "P" and "D" are cut out of the arrow's own path, so they cannot move:
         keep this phrase's float tiny so it stays visually aligned with them. */
      .t-pres-a    { --lift: -2px; --bob: 6s;   animation-delay: 5.5s,  -2.2s; }
      .t-pres-b    { --lift: -2px; --bob: 6s;   animation-delay: 5.75s, -2.2s; }

      @media (prefers-reduced-motion: reduce) {
        .txt { animation: none; opacity: 1; transform: none; }
      }
    </style>
